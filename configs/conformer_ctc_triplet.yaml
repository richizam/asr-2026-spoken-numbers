seed: 42
exp_name: conformer_ctc_triplet

data:
  data_root: asr-2026-spoken-numbers-recognition-challenge
  train_csv: asr-2026-spoken-numbers-recognition-challenge/train.csv
  dev_csv:   asr-2026-spoken-numbers-recognition-challenge/dev.csv
  test_csv:  asr-2026-spoken-numbers-recognition-challenge/test.csv
  target_mode: triplet_3x3
  cache_root: cache_16k
  target_sr: 16000
  max_seconds: 6.0
  noise_dir: ""
  rir_dir: ""

model:
  vocab_size: 12
  n_mels: 80
  d_model: 128
  ffn_expansion: 2
  num_heads: 4
  num_layers: 12
  conv_kernel: 15
  dropout: 0.1
  subsampling_channels: 32

train:
  batch_size: 16
  grad_accum: 2
  num_workers: 4
  max_epochs: 120
  lr: 1.0e-3
  weight_decay: 1.0e-4
  warmup_steps: 2000
  grad_clip: 1.0
  amp: true
  log_every: 50
  val_every: 1
  specaug:
    num_freq_masks: 2
    freq_mask_param: 15
    num_time_masks: 2
    time_mask_param: 35
  ema:
    enabled: true
    decay: 0.999

decode:
  beam_width: 16
  alpha: 0.4
  beta: 1.0
  temperature: 1.0
  method: beam_trie
  lm_path: ""

paths:
  out_dir: runs/conformer_ctc_triplet
